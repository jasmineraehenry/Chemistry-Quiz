<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science 10: Chemistry Unit Exam Review</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f9f9f9;
            color: #000000; /* Text is strictly black */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .quiz-container {
            background-color: #ffffff;
            max-width: 650px;
            width: 100%;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            text-align: center;
        }
        .progress {
            font-size: 14px;
            color: #555555;
            text-align: center;
            margin-bottom: 25px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            background-color: #ffffff;
            color: #000000;
            border: 2px solid #333333;
            padding: 14px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #f0f0f0;
        }
        .option-btn:disabled {
            cursor: not-allowed;
        }
        /* Color states for selected choices */
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
        }
        .feedback-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background-color: #f1f3f5;
            border-left: 5px solid #333333;
            display: none;
            line-height: 1.5;
        }
        .feedback-box strong {
            display: block;
            margin-bottom: 5px;
        }
        .action-container {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }
        .next-btn {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }
        .next-btn:hover {
            background-color: #333333;
        }
        /* Results Section */
        .results-section {
            display: none;
            text-align: center;
        }
        .score-display {
            font-size: 48px;
            font-weight: bold;
            margin: 20px 0;
        }
        .mistakes-container {
            text-align: left;
            margin-top: 30px;
            border-top: 2px solid #000000;
            padding-top: 20px;
        }
        .mistake-item {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #cccccc;
        }
        .mistake-q {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-window">
        <h1 id="quiz-title">Chemistry Unit Exam Review</h1>
        <div class="progress" id="progress-text">Question 1 of 25</div>
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options-container" id="options-container"></div>
        <div class="feedback-box" id="feedback-box"></div>
        <div class="action-container">
            <button class="next-btn" id="next-btn" onclick="loadNextQuestion()">Next Question &rarr;</button>
        </div>
    </div>

    <div id="results-window" class="results-section">
        <h1>Review Completed!</h1>
        <p>Your Final Score:</p>
        <div class="score-display" id="score-display">0 / 25</div>
        <p id="score-commentary"></p>
        
        <div class="mistakes-container" id="mistakes-container">
            <h3>Review of Questions Answered Incorrectly:</h3>
            <div id="mistakes-list"></div>
        </div>
    </div>
</div>

    let currentQuestionIndex = 0;
    let score = 0;
    let userMistakes = [];

    function loadQuestion() {
        // Reset interactive elements
        document.getElementById('feedback-box').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
        
        const currentQuestion = quizData[currentQuestionIndex];
        
        // Update display text
        document.getElementById('progress-text').innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        document.getElementById('question-text').innerText = currentQuestion.q;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        // Generate choice inputs
        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = option.text;
            button.onclick = () => handleOptionSelection(button, option);
            optionsContainer.appendChild(button);
        });
    }

    function handleOptionSelection(selectedButton, selectedOption) {
        const currentQuestion = quizData[currentQuestionIndex];
        const buttons = document.querySelectorAll('.option-btn');
        
        // Lock out alternate inputs
        buttons.forEach(btn => btn.disabled = true);
        
        const feedbackBox = document.getElementById('feedback-box');
        feedbackBox.style.display = 'block';
        
        if (selectedOption.correct) {
            selectedButton.classList.add('correct');
            score++;
            feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOption.rationale}`;
        } else {
            selectedButton.classList.add('incorrect');
            feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOption.rationale}<br><br><em>Hint Review:</em> ${currentQuestion.hint}`;
            
            // Highlight the proper solution paths safely
            buttons.forEach((btn, idx) => {
                if (currentQuestion.options[idx].correct) {
                    btn.classList.add('correct');
                }
            });

            // Store contextual feedback properties for review panel
            userMistakes.push({
                question: currentQuestion.q,
                yourChoice: selectedOption.text,
                correctChoice: currentQuestion.options.find(o => o.correct).text,
                remediation: selectedOption.rationale
            });
        }
        
        document.getElementById('next-btn').style.display = 'block';
    }

    function loadNextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showFinalResults();
        }
    }

    function showFinalResults() {
        document.getElementById('quiz-window').style.display = 'none';
        document.getElementById('results-window').style.display = 'block';
        
        document.getElementById('score-display').innerText = `${score} / ${quizData.length}`;
        
        const percentage = (score / quizData.length) * 100;
        let commentary = "";
        if (percentage === 100) commentary = "Exceptional performance! You have fully mastered this unit.";
        else if (percentage >= 80) commentary = "Great job! You have a solid grasp of basic chemistry principles.";
        else if (percentage >= 50) commentary = "Good effort. Review the specific feedback on your missed concepts below.";
        else commentary = "Keep practicing. Read over the foundational explanations below and attempt the review again.";
        
        document.getElementById('score-commentary').innerText = commentary;
        
        const mistakesList = document.getElementById('mistakes-list');
        mistakesList.innerHTML = '';
        
        if (userMistakes.length === 0) {
            mistakesList.innerHTML = '<p style="color: #2b573a; font-weight: bold;">No mistakes made! Fantastic work.</p>';
        } else {
            userMistakes.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'mistake-item';
                itemDiv.innerHTML = `
                    <div class="mistake-q">${item.question}</div>
                    <div style="margin: 3px 0;">❌ <strong>Your selection:</strong> ${item.yourChoice}</div>
                    <div style="margin: 3px 0;">✅ <strong>Correct answer:</strong> ${item.correctChoice}</div>
                    <div style="margin-top: 8px; font-size: 14px; color: #444444; font-style: italic;"><strong>Why?</strong> ${item.remediation}</div>
                `;
                mistakesList.appendChild(itemDiv);
            });
        }
    }

    // Initialize the quiz flow upon document completion
    window.onload = loadQuestion;
</script>

</body>
</html>
